# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1

      # Sanitizer tuning (must be before setup-deps). clang-ubsan uses ASan too; without
      # detect_odr_violation=0, RcppParallel/TBB can abort with ODR-violation during lazy-load.
      # clang21/clang22 use ASan-instrumented R: detect_leaks=0 avoids LSAN noise from sed/tar/etc.
      # Also set on check-r-package step — rhub/pkgbuild subprocesses do not always inherit GITHUB_ENV.
      - name: ASan / UBSan env (clang-asan / gcc-asan / clang-ubsan / clang21 / clang22)
        if: ${{ matrix.config.label == 'clang-asan' || matrix.config.label == 'gcc-asan' || matrix.config.label == 'clang-ubsan' || matrix.config.label == 'clang21' || matrix.config.label == 'clang22' }}
        run: |
          echo "ASAN_OPTIONS=detect_odr_violation=0:detect_leaks=0" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=halt_on_error=0:abort_on_error=0" >> "$GITHUB_ENV"

      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - name: Reinstall rlang from GitHub before setup-deps (ubuntu-next)
        if: ${{ matrix.config.label == 'ubuntu-next' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER", ""); if (!nzchar(lib)) lib <- .libPaths()[1L]; dir.create(lib, showWarnings = FALSE, recursive = TRUE); if (!lib %in% .libPaths()) .libPaths(c(lib, .libPaths())); if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes", lib = lib, repos = "https://cloud.r-project.org", type = "source", Ncpus = 1L); try(remove.packages("rlang", lib = lib), silent = TRUE); remotes::install_github("r-lib/rlang", lib = lib, upgrade = "never", force = TRUE, auth_token = Sys.getenv("GITHUB_TOKEN")); cat("rlang version after GitHub install:", as.character(packageVersion("rlang")), "\n")'

      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - name: RcppParallel backend workaround (c23 / noremap / clang16 / clang17 / clang21 / clang22)
        if: ${{ matrix.config.label == 'c23' || matrix.config.label == 'noremap' || matrix.config.label == 'clang16' || matrix.config.label == 'clang17' || matrix.config.label == 'clang21' || matrix.config.label == 'clang22' }}
        run: |
          echo "RCPP_PARALLEL_BACKEND=tinythread" >> "$GITHUB_ENV"

      # On these images, prebuilt RcppParallel+TBB may fail at namespace load (libc++ mismatch or
      # missing ASan symbols). Rebuild RcppParallel in tinythread mode.
      - name: Reinstall RcppParallel (tinythread, no TBB) for c23 / noremap / clang16 / clang17 / clang21 / clang22
        if: ${{ matrix.config.label == 'c23' || matrix.config.label == 'noremap' || matrix.config.label == 'clang16' || matrix.config.label == 'clang17' || matrix.config.label == 'clang21' || matrix.config.label == 'clang22' }}
        run: |
          set -eux
          Rscript -e 'lib <- .libPaths()[1L]; if ("RcppParallel" %in% rownames(installed.packages(lib.loc = lib, noCache = TRUE))) remove.packages("RcppParallel", lib = lib); Sys.setenv(RCPP_PARALLEL_BACKEND = "tinythread", RCPP_PARALLEL_USE_TBB = "0"); install.packages("RcppParallel", lib = lib, repos = "https://cloud.r-project.org", type = "source", Ncpus = 2L); cat("RcppParallel backend env:", Sys.getenv("RCPP_PARALLEL_BACKEND"), "\n")'

      # Compare runner R to current CRAN release (via rversions). When R is not ahead of that release,
      # skip R-devel workarounds (ubuntu-next rlang rebuild, etc.); Rcpp is handled by Ensure step.
      # Use a temp .R file (not multiline Rscript -e): Windows Git Bash + R-devel can segfault on -e.
      - name: R vs CRAN release (for workarounds)
        id: r-release
        run: |
          set -eux
          f="${GITHUB_WORKSPACE}/.rhub-r-release-detect.R"
          cat <<'RS' >"$f"
          gh <- Sys.getenv("GITHUB_OUTPUT")
          stopifnot(nzchar(gh))
          is_rchk <- grepl("rchk", Sys.getenv("R_LIB_FOR_PAK", ""), ignore.case = TRUE) ||
            grepl("rchk", R.home(), ignore.case = TRUE)
          rel <- if (!is_rchk) {
            lib_user <- Sys.getenv("R_LIBS_USER", "")
            if (!nzchar(lib_user)) lib_user <- .libPaths()[1L]
            dir.create(lib_user, showWarnings = FALSE, recursive = TRUE)
            if (!lib_user %in% .libPaths()) .libPaths(c(lib_user, .libPaths()))
            ok <- tryCatch({
              install.packages(
                "rversions",
                lib = lib_user,
                repos = "https://cloud.r-project.org",
                quiet = TRUE,
                type = "source",
                Ncpus = 1L,
                dependencies = TRUE
              )
              requireNamespace("rversions", quietly = TRUE)
            }, error = function(e) FALSE)
            if (ok) as.character(rversions::r_release()[["version"]][1]) else NA_character_
          } else {
            tryCatch({
              dcf <- read.dcf(url("https://cloud.r-project.org/src/base/VERSION-INFO.dcf"))
              as.character(dcf[1, "R"])
            }, error = function(e) NA_character_)
          }
          rv <- as.character(getRversion())
          ahead <- if (!is.na(rel) && nzchar(rel)) {
            getRversion() > package_version(rel)
          } else {
            FALSE
          }
          if (is.na(rel) || !nzchar(rel)) rel <- "unknown"
          cat(sprintf("cran_r_release=%s\n", rel), file = gh, append = TRUE)
          cat(sprintf("r_ahead_of_release=%s\n", if (ahead) "true" else "false"), file = gh, append = TRUE)
          message(
            "R version=", rv, " | CRAN release=", rel,
            " | r_ahead_of_release=", ahead
          )
          RS
          Rscript "$f"
          rm -f "$f"

      # ubuntu-next: CRAN *binary* rlang.so can reference SETLENGTH while R-patched/RC no longer exposes it;
      # library(testthat) → rlang then fails. Only when R is ahead of current CRAN release (same class of drift).
      - name: Reinstall rlang from source (ubuntu-next — testthat / SETLENGTH)
        if: ${{ matrix.config.label == 'ubuntu-next' && steps.r-release.outputs.r_ahead_of_release == 'true' }}
        run: |
          set -eux
          Rscript -e 'lib <- .libPaths()[1L]; try(remove.packages("rlang", lib = lib), silent = TRUE); install.packages("rlang", lib = lib, repos = "https://cloud.r-project.org", type = "source", Ncpus = 2L)'

      # Workaround for: lazy-load fails loading RcppArmadillo.so — libquadmath.so.0 not found.
      # Intel platform uses a Fedora container; RcppArmadillo (via gfortran/quadmath) needs the
      # libquadmath runtime package on the image. Not a glmbayes R code issue.
      - name: Install libquadmath (Fedora / Intel container)
        if: ${{ matrix.config.label == 'intel' }}
        run: |
          set -eux
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y libquadmath
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y libquadmath
          else
            echo "Expected dnf or microdnf on this image" >&2
            exit 1
          fi

      - name: Diagnostics (R / Rcpp)
        if: ${{ matrix.config.label == 'valgrind' || matrix.config.label == 'nosuggests' || matrix.config.label == 'clang-asan' || matrix.config.label == 'gcc-asan' }}
        run: |
          Rscript -e "cat('R:', R.version.string, '\n')"
          Rscript -e "if (requireNamespace('Rcpp', quietly=TRUE)) cat('Rcpp:', as.character(packageVersion('Rcpp')), '\n') else cat('Rcpp: <not installed>\\n')"

      # nosuggests: setup-deps does not install Suggests — prepend one lib via R_LIBS for Rcpp.
      # Do NOT set R_LIBS_USER to that path: it replaces the default user library and hides packages
      # setup-deps installed (e.g. rcmdcheck for run-check). Vignettes are skipped on run-check.
      # BUILD_ARGS/CHECK_ARGS must be in GITHUB_ENV: nested check-r-package reads Sys.getenv("BUILD_ARGS").
      - name: Skip vignettes (nosuggests) — BUILD_ARGS/CHECK_ARGS for rcmdcheck
        if: ${{ matrix.config.label == 'nosuggests' }}
        run: |
          echo "BUILD_ARGS=--no-build-vignettes" >> "$GITHUB_ENV"
          echo "CHECK_ARGS=--no-build-vignettes --ignore-vignettes" >> "$GITHUB_ENV"

      - name: Nosuggests — library path for Rcpp (source)
        if: ${{ matrix.config.label == 'nosuggests' }}
        env:
          RHUB_NS_LIB: ${{ format('{0}/rhub-nosuggests-lib', runner.temp) }}
        run: |
          set -eux
          mkdir -p "$RHUB_NS_LIB"
          echo "R_LIBS=$RHUB_NS_LIB" >> "$GITHUB_ENV"

      - name: Rebuild RcppArmadillo from source (valgrind)
        if: ${{ matrix.config.label == 'valgrind' }}
        run: |
          Rscript -e "lib <- .libPaths()[1L]; if ('RcppArmadillo' %in% rownames(installed.packages(lib.loc=lib, noCache=TRUE))) remove.packages('RcppArmadillo', lib=lib); install.packages('RcppArmadillo', lib=lib, repos='https://cloud.r-project.org', type='source', Ncpus=2L)"

      # Valgrind: R CMD check can report Status: OK while Valgrind still logs "ERROR SUMMARY: N errors"
      # in *.Rout files. r-hub run-check then runs a separate "Fail for valgrind errors" step that
      # greps those lines — so the job fails even when rcmdcheck exits successfully. Pass R's own
      # memcheck suppressions (under R_HOME/share/valgrind/) via VALGRIND_OPTS; add package-specific
      # suppressions only after inspecting which .Rout file matches (see on-failure step below).
      - name: Valgrind — R memcheck suppressions (VALGRIND_OPTS)
        if: ${{ matrix.config.label == 'valgrind' }}
        run: |
          set -eux
          OPTS=$(Rscript -e 'd <- file.path(R.home("share"), "valgrind"); supp <- if (dir.exists(d)) list.files(d, pattern = "[.]supp$", full.names = TRUE) else character(); if (length(supp)) cat(paste(paste0("--suppressions=", supp), collapse = " "))')
          if [ -n "${OPTS:-}" ]; then
            echo "VALGRIND_OPTS=${OPTS}" >> "$GITHUB_ENV"
          fi

      - name: Debug selected check path
        run: |
          echo "matrix.config.label=${{ matrix.config.label }}"
          echo "v2_labels=clang-asan,gcc-asan,clang-ubsan,valgrind,nosuggests"
          echo "will_use_v2=${{ contains('clang-asan,gcc-asan,clang-ubsan,valgrind,nosuggests', matrix.config.label) }}"
          echo "will_use_rhub_v1=${{ !contains('clang-asan,gcc-asan,clang-ubsan,valgrind,nosuggests', matrix.config.label) }}"

      # clang-asan / gcc-asan / clang-ubsan / valgrind / nosuggests: use r-lib check-r-package directly to avoid
      # r-hub wrapper/post-step behavior and keep check args explicit per label.
      - uses: r-lib/actions/check-r-package@v2
        if: ${{ contains('clang-asan,gcc-asan,clang-ubsan,valgrind,nosuggests', matrix.config.label) }}
        env:
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=0:abort_on_error=0
          R_KEEP_PKG_SOURCE: yes
          R_LIBS: ${{ matrix.config.label == 'nosuggests' && format('{0}/rhub-nosuggests-lib', runner.temp) || '' }}
        with:
          args: ${{ matrix.config.label == 'valgrind' && 'c("--no-manual", "--as-cran", "--use-valgrind", "--install-args=--build", "--no-stop-on-test-error")' || matrix.config.label == 'nosuggests' && 'c("--no-manual", "--as-cran", "--install-args=--build", "--no-build-vignettes", "--ignore-vignettes", "--no-stop-on-test-error")' || 'c("--no-manual", "--as-cran", "--install-args=--build", "--no-stop-on-test-error")' }}
          build_args: ${{ matrix.config.label == 'nosuggests' && 'c("--no-manual", "--no-build-vignettes")' || 'c("--no-manual")' }}
          upload-results: never
          upload-snapshots: false

      - uses: r-hub/actions/run-check@v1
        if: ${{ !contains('clang-asan,gcc-asan,clang-ubsan,valgrind,nosuggests', matrix.config.label) }}
        env:
          ASAN_OPTIONS: ${{ (matrix.config.label == 'clang-ubsan' || matrix.config.label == 'clang21' || matrix.config.label == 'clang22') && 'detect_odr_violation=0:detect_leaks=0' || '' }}
          UBSAN_OPTIONS: ${{ (matrix.config.label == 'clang-ubsan' || matrix.config.label == 'clang21' || matrix.config.label == 'clang22') && 'halt_on_error=0:abort_on_error=0' || '' }}
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - name: Valgrind — ERROR SUMMARY lines in check/*.Rout (on failure)
        if: ${{ failure() && matrix.config.label == 'valgrind' }}
        run: |
          set -x
          grep -R "ERROR SUMMARY" check/ 2>/dev/null | head -120 || true

      # On install ERROR, R points to check/*/00install.out — upload so you can download from the Actions UI.
      - name: Upload R CMD check logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rhub-check-${{ matrix.config.label }}
          if-no-files-found: warn
          path: |
            check/**/00install.out
            check/**/00check.log

      - name: Collect platform report (always)
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.config.label }}
          JOB_STATUS: ${{ job.status }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p platform-report
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          cat <<'PRR' >"$f"
          ensure_jsonlite <- function() {
            if (requireNamespace("jsonlite", quietly = TRUE)) return(invisible())
            utils::install.packages("jsonlite", repos = "https://cloud.r-project.org",
                                    quiet = TRUE, Ncpus = 1L)
          }
          plat <- Sys.getenv("PLATFORM", "unknown")
          job_status <- Sys.getenv("JOB_STATUS", "unknown")
          lib_user <- Sys.getenv("R_LIBS_USER", "")
          if (nzchar(lib_user) && dir.exists(lib_user)) {
            .libPaths(c(lib_user, .libPaths()))
          }
          lib_run <- Sys.getenv("R_LIBS", "")
          if (nzchar(lib_run) && dir.exists(lib_run)) {
            .libPaths(c(lib_run, .libPaths()))
          }
          rver <- as.character(getRversion())
          r_svn_rev <- tryCatch({
            v <- R.version
            s <- if (!is.null(v[["svn.rev"]])) v[["svn.rev"]] else v[["svn rev"]]
            s <- as.character(s)
            if (!length(s) || !nzchar(s)) "unknown" else s
          }, error = function(e) "unknown")
          rcpp <- if (requireNamespace("Rcpp", quietly = TRUE)) {
            as.character(packageVersion("Rcpp"))
          } else "not-installed"
          pkg_name <- tryCatch({
            if (file.exists("DESCRIPTION")) {
              d <- read.dcf("DESCRIPTION")
              trimws(as.character(d[1L, "Package"]))
            } else {
              "pkg"
            }
          }, error = function(e) "pkg")
          r_cmd <- "no-check-log"
          if (identical(plat, "rchk")) {
            r_cmd <- "n/a (rchk.sh — not R CMD check)"
          } else if (dir.exists("check")) {
            logs <- list.files("check", pattern = "^00check\\.log$", full.names = TRUE, recursive = TRUE)
            if (length(logs)) {
              mt <- file.info(logs)$mtime
              ord <- order(mt, na.last = TRUE)
              pick <- logs[ord[length(ord)]]
              lines <- readLines(pick, warn = FALSE, encoding = "UTF-8")
              status_lines <- grep("^Status:", lines, value = TRUE)
              if (length(status_lines)) {
                last <- status_lines[length(status_lines)]
                r_cmd <- trimws(sub("^Status:\\s*", "", last, perl = TRUE))
                if (!nzchar(r_cmd)) r_cmd <- "no-status-line"
              } else {
                r_cmd <- "no-status-line"
              }
            }
          }
          ensure_jsonlite()
          safe_plat <- gsub("[^A-Za-z0-9._-]", "_", plat)
          out_file <- file.path("platform-report", paste0(safe_plat, ".json"))
          report <- list(
            platform = plat,
            r_version = rver,
            r_svn_rev = r_svn_rev,
            rcpp_version = rcpp,
            r_cmd_check_status = r_cmd,
            job_status = job_status,
            actions_run_url = Sys.getenv("ACTIONS_RUN_URL", "")
          )
          if (identical(plat, "rchk")) {
            report$rchk_check_kind <- "rchk.sh static analysis (not CRAN R CMD check)"
            native_ok <- NA
            native_hint <- ""
            ins_logs <- if (dir.exists("check")) {
              list.files("check", pattern = "00install\\.out$", full.names = TRUE, recursive = TRUE)
            } else {
              character()
            }
            done_re <- paste0("^\\* DONE \\(", pkg_name, "\\)")
            for (inf in ins_logs) {
              ll <- tryCatch(readLines(inf, warn = FALSE), error = function(e) character())
              if (any(grepl(done_re, ll, perl = TRUE))) {
                native_ok <- TRUE
                native_hint <- inf
                break
              }
            }
            if (is.na(native_ok) && length(ins_logs)) {
              native_ok <- FALSE
            }
            report$rchk_native_install_done <- if (isTRUE(native_ok)) {
              "yes"
            } else if (isFALSE(native_ok)) {
              "no"
            } else {
              "unknown"
            }
            report$rchk_install_log_path <- native_hint
            ws <- Sys.getenv("GITHUB_WORKSPACE", ".")
            if (!nzchar(ws) || !dir.exists(ws)) {
              ws <- "."
            }
            cand <- tryCatch(
              list.files(
                ws,
                pattern = "rchk|bcheck|Rchk|checks\\.txt",
                full.names = TRUE,
                recursive = TRUE,
                ignore.case = TRUE
              ),
              error = function(e) character()
            )
            cand <- cand[!dir.exists(cand)]
            logs_all <- tryCatch(
              list.files(
                ws,
                pattern = "\\.(log|out)$",
                full.names = TRUE,
                recursive = TRUE,
                ignore.case = TRUE
              ),
              error = function(e) character()
            )
            logs_all <- logs_all[!dir.exists(logs_all)]
            fi <- tryCatch(file.info(logs_all), error = function(e) NULL)
            if (!is.null(fi) && length(logs_all) && nrow(fi) == length(logs_all)) {
              logs_all <- logs_all[!is.na(fi$size) & fi$size > 0L & fi$size < 250000L]
            }
            logs_all <- utils::head(logs_all, 45L)
            cand2 <- character()
            for (pp in logs_all) {
              ll <- tryCatch(readLines(pp, n = 120L, warn = FALSE), error = function(e) character())
              if (length(ll) && any(grepl("bcheck|rchk|Running bcheck", ll, ignore.case = TRUE))) {
                cand2 <- c(cand2, pp)
              }
            }
            cand <- unique(c(cand, cand2))
            cand <- utils::head(cand, 24L)
            report$rchk_artifact_paths <- if (length(cand)) {
              paste(gsub(paste0("^", ws, "/"), "", cand, fixed = TRUE), collapse = "; ")
            } else {
              ""
            }
            ex_lim <- 6000L
            lines_h <- character()
            for (pp in cand) {
              if (!file.exists(pp)) next
              sz <- tryCatch(file.info(pp)$size, error = function(e) NA_real_)
              if (is.na(sz) || sz <= 0L || sz > 250000L) next
              ll <- tryCatch(readLines(pp, warn = FALSE), error = function(e) character())
              hit <- grep(
                "[\\[](PB|UP)[\\]]|^ERROR:|Running bcheck|====[[:space:]]*rchk|bcheck|objdump:",
                ll,
                ignore.case = TRUE,
                value = TRUE
              )
              if (length(hit)) {
                rel <- gsub(paste0("^", ws, "/"), "", pp, fixed = TRUE)
                lines_h <- c(lines_h, paste0("--- ", rel, " ---"), utils::head(hit, 40L))
              }
              if (nchar(paste(lines_h, collapse = "\n")) > ex_lim) {
                break
              }
            }
            rchk_excerpt <- paste(lines_h, collapse = "\n")
            if (nchar(rchk_excerpt) > ex_lim) {
              rchk_excerpt <- substr(rchk_excerpt, 1L, ex_lim)
            }
            report$rchk_log_excerpt <- rchk_excerpt
          }
          jsonlite::write_json(report, out_file, auto_unbox = TRUE, pretty = TRUE)
          PRR
          Rscript "$f"

      - name: Upload platform report artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-report-${{ matrix.config.label }}
          if-no-files-found: warn
          path: platform-report/*.json

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      # Same gate as linux-containers (Rcpp Function.h svn 89746 cutoff).
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}

      - name: R vs CRAN release (for workarounds)
        id: r-release
        shell: bash
        run: |
          set -eux
          f="${GITHUB_WORKSPACE}/.rhub-r-release-detect.R"
          cat <<'RS' >"$f"
          gh <- Sys.getenv("GITHUB_OUTPUT")
          stopifnot(nzchar(gh))
          is_rchk <- grepl("rchk", Sys.getenv("R_LIB_FOR_PAK", ""), ignore.case = TRUE) ||
            grepl("rchk", R.home(), ignore.case = TRUE)
          rel <- if (!is_rchk) {
            lib_user <- Sys.getenv("R_LIBS_USER", "")
            if (!nzchar(lib_user)) lib_user <- .libPaths()[1L]
            dir.create(lib_user, showWarnings = FALSE, recursive = TRUE)
            if (!lib_user %in% .libPaths()) .libPaths(c(lib_user, .libPaths()))
            ok <- tryCatch({
              install.packages(
                "rversions",
                lib = lib_user,
                repos = "https://cloud.r-project.org",
                quiet = TRUE,
                type = "source",
                Ncpus = 1L,
                dependencies = TRUE
              )
              requireNamespace("rversions", quietly = TRUE)
            }, error = function(e) FALSE)
            if (ok) as.character(rversions::r_release()[["version"]][1]) else NA_character_
          } else {
            tryCatch({
              dcf <- read.dcf(url("https://cloud.r-project.org/src/base/VERSION-INFO.dcf"))
              as.character(dcf[1, "R"])
            }, error = function(e) NA_character_)
          }
          rv <- as.character(getRversion())
          ahead <- if (!is.na(rel) && nzchar(rel)) {
            getRversion() > package_version(rel)
          } else {
            FALSE
          }
          if (is.na(rel) || !nzchar(rel)) rel <- "unknown"
          cat(sprintf("cran_r_release=%s\n", rel), file = gh, append = TRUE)
          cat(sprintf("r_ahead_of_release=%s\n", if (ahead) "true" else "false"), file = gh, append = TRUE)
          message(
            "R version=", rv, " | CRAN release=", rel,
            " | r_ahead_of_release=", ahead
          )
          RS
          Rscript "$f"
          rm -f "$f"

      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}

      # On install ERROR, R points to check/*/00install.out — upload so you can download from the Actions UI.
      - name: Upload R CMD check logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rhub-check-${{ matrix.config.label }}
          if-no-files-found: warn
          path: |
            check/**/00install.out
            check/**/00check.log

      - name: Collect platform report (always)
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.config.label }}
          JOB_STATUS: ${{ job.status }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p platform-report
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          cat <<'PRR' >"$f"
          ensure_jsonlite <- function() {
            if (requireNamespace("jsonlite", quietly = TRUE)) return(invisible())
            utils::install.packages("jsonlite", repos = "https://cloud.r-project.org",
                                    quiet = TRUE, Ncpus = 1L)
          }
          plat <- Sys.getenv("PLATFORM", "unknown")
          job_status <- Sys.getenv("JOB_STATUS", "unknown")
          lib_user <- Sys.getenv("R_LIBS_USER", "")
          if (nzchar(lib_user) && dir.exists(lib_user)) {
            .libPaths(c(lib_user, .libPaths()))
          }
          lib_run <- Sys.getenv("R_LIBS", "")
          if (nzchar(lib_run) && dir.exists(lib_run)) {
            .libPaths(c(lib_run, .libPaths()))
          }
          rver <- as.character(getRversion())
          r_svn_rev <- tryCatch({
            v <- R.version
            s <- if (!is.null(v[["svn.rev"]])) v[["svn.rev"]] else v[["svn rev"]]
            s <- as.character(s)
            if (!length(s) || !nzchar(s)) "unknown" else s
          }, error = function(e) "unknown")
          rcpp <- if (requireNamespace("Rcpp", quietly = TRUE)) {
            as.character(packageVersion("Rcpp"))
          } else "not-installed"
          pkg_name <- tryCatch({
            if (file.exists("DESCRIPTION")) {
              d <- read.dcf("DESCRIPTION")
              trimws(as.character(d[1L, "Package"]))
            } else {
              "pkg"
            }
          }, error = function(e) "pkg")
          r_cmd <- "no-check-log"
          if (identical(plat, "rchk")) {
            r_cmd <- "n/a (rchk.sh — not R CMD check)"
          } else if (dir.exists("check")) {
            logs <- list.files("check", pattern = "^00check\\.log$", full.names = TRUE, recursive = TRUE)
            if (length(logs)) {
              mt <- file.info(logs)$mtime
              ord <- order(mt, na.last = TRUE)
              pick <- logs[ord[length(ord)]]
              lines <- readLines(pick, warn = FALSE, encoding = "UTF-8")
              status_lines <- grep("^Status:", lines, value = TRUE)
              if (length(status_lines)) {
                last <- status_lines[length(status_lines)]
                r_cmd <- trimws(sub("^Status:\\s*", "", last, perl = TRUE))
                if (!nzchar(r_cmd)) r_cmd <- "no-status-line"
              } else {
                r_cmd <- "no-status-line"
              }
            }
          }
          ensure_jsonlite()
          safe_plat <- gsub("[^A-Za-z0-9._-]", "_", plat)
          out_file <- file.path("platform-report", paste0(safe_plat, ".json"))
          report <- list(
            platform = plat,
            r_version = rver,
            r_svn_rev = r_svn_rev,
            rcpp_version = rcpp,
            r_cmd_check_status = r_cmd,
            job_status = job_status,
            actions_run_url = Sys.getenv("ACTIONS_RUN_URL", "")
          )
          if (identical(plat, "rchk")) {
            report$rchk_check_kind <- "rchk.sh static analysis (not CRAN R CMD check)"
            native_ok <- NA
            native_hint <- ""
            ins_logs <- if (dir.exists("check")) {
              list.files("check", pattern = "00install\\.out$", full.names = TRUE, recursive = TRUE)
            } else {
              character()
            }
            done_re <- paste0("^\\* DONE \\(", pkg_name, "\\)")
            for (inf in ins_logs) {
              ll <- tryCatch(readLines(inf, warn = FALSE), error = function(e) character())
              if (any(grepl(done_re, ll, perl = TRUE))) {
                native_ok <- TRUE
                native_hint <- inf
                break
              }
            }
            if (is.na(native_ok) && length(ins_logs)) {
              native_ok <- FALSE
            }
            report$rchk_native_install_done <- if (isTRUE(native_ok)) {
              "yes"
            } else if (isFALSE(native_ok)) {
              "no"
            } else {
              "unknown"
            }
            report$rchk_install_log_path <- native_hint
            ws <- Sys.getenv("GITHUB_WORKSPACE", ".")
            if (!nzchar(ws) || !dir.exists(ws)) {
              ws <- "."
            }
            cand <- tryCatch(
              list.files(
                ws,
                pattern = "rchk|bcheck|Rchk|checks\\.txt",
                full.names = TRUE,
                recursive = TRUE,
                ignore.case = TRUE
              ),
              error = function(e) character()
            )
            cand <- cand[!dir.exists(cand)]
            logs_all <- tryCatch(
              list.files(
                ws,
                pattern = "\\.(log|out)$",
                full.names = TRUE,
                recursive = TRUE,
                ignore.case = TRUE
              ),
              error = function(e) character()
            )
            logs_all <- logs_all[!dir.exists(logs_all)]
            fi <- tryCatch(file.info(logs_all), error = function(e) NULL)
            if (!is.null(fi) && length(logs_all) && nrow(fi) == length(logs_all)) {
              logs_all <- logs_all[!is.na(fi$size) & fi$size > 0L & fi$size < 250000L]
            }
            logs_all <- utils::head(logs_all, 45L)
            cand2 <- character()
            for (pp in logs_all) {
              ll <- tryCatch(readLines(pp, n = 120L, warn = FALSE), error = function(e) character())
              if (length(ll) && any(grepl("bcheck|rchk|Running bcheck", ll, ignore.case = TRUE))) {
                cand2 <- c(cand2, pp)
              }
            }
            cand <- unique(c(cand, cand2))
            cand <- utils::head(cand, 24L)
            report$rchk_artifact_paths <- if (length(cand)) {
              paste(gsub(paste0("^", ws, "/"), "", cand, fixed = TRUE), collapse = "; ")
            } else {
              ""
            }
            ex_lim <- 6000L
            lines_h <- character()
            for (pp in cand) {
              if (!file.exists(pp)) next
              sz <- tryCatch(file.info(pp)$size, error = function(e) NA_real_)
              if (is.na(sz) || sz <= 0L || sz > 250000L) next
              ll <- tryCatch(readLines(pp, warn = FALSE), error = function(e) character())
              hit <- grep(
                "[\\[](PB|UP)[\\]]|^ERROR:|Running bcheck|====[[:space:]]*rchk|bcheck|objdump:",
                ll,
                ignore.case = TRUE,
                value = TRUE
              )
              if (length(hit)) {
                rel <- gsub(paste0("^", ws, "/"), "", pp, fixed = TRUE)
                lines_h <- c(lines_h, paste0("--- ", rel, " ---"), utils::head(hit, 40L))
              }
              if (nchar(paste(lines_h, collapse = "\n")) > ex_lim) {
                break
              }
            }
            rchk_excerpt <- paste(lines_h, collapse = "\n")
            if (nchar(rchk_excerpt) > ex_lim) {
              rchk_excerpt <- substr(rchk_excerpt, 1L, ex_lim)
            }
            report$rchk_log_excerpt <- rchk_excerpt
          }
          jsonlite::write_json(report, out_file, auto_unbox = TRUE, pretty = TRUE)
          PRR
          Rscript "$f"

      - name: Upload platform report artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-report-${{ matrix.config.label }}
          if-no-files-found: warn
          path: platform-report/*.json

  platform-summary:
    needs: [linux-containers, other-platforms]
    if: always()
    runs-on: ubuntu-latest
    name: platform-summary
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Download per-platform reports
        uses: actions/download-artifact@v4
        with:
          pattern: platform-report-*
          merge-multiple: true
          path: platform-reports
          # Do not fail the summary job when a matrix leg failed before upload (e.g. Windows Rscript)
          if-no-files-found: warn

      - name: Build cross-platform summary table
        shell: bash
        run: |
          set -eu
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          cat <<'PRR' >"$f"
          ensure_jsonlite <- function() {
            if (requireNamespace("jsonlite", quietly = TRUE)) return(invisible())
            utils::install.packages("jsonlite", repos = "https://cloud.r-project.org",
                                    quiet = TRUE, Ncpus = 1L)
          }
          ensure_jsonlite()
          root <- "platform-reports"
          rows <- list()
          if (dir.exists(root)) {
            paths <- sort(list.files(root, pattern = "\\.json$", full.names = TRUE, recursive = TRUE))
            for (p in paths) {
              row <- tryCatch(jsonlite::fromJSON(p, simplifyVector = TRUE), error = function(e) NULL)
              if (!is.null(row)) rows <- c(rows, list(row))
            }
          }
          plat_key <- function(x) {
            v <- x[["platform"]]
            if (is.null(v)) "" else trimws(as.character(v))
          }
          plat_label <- function(x) {
            tryCatch(trimws(as.character(x[["platform"]])), error = function(e) "")
          }
          is_rchk_row <- function(x) identical(plat_label(x), "rchk")
          if (length(rows)) {
            ord <- order(vapply(rows, plat_key, ""))
            rows <- rows[ord]
          }
          getf <- function(x, nm, alt = "unknown") {
            v <- x[[nm]]
            if (is.null(v)) return(alt)
            v <- as.character(v)
            if (!length(v) || !nzchar(v)) alt else v
          }
          # paste0 (not sprintf): cell text can contain % or other sprintf specials
          md_row8 <- function(a, b, c, d, e, f, g, h) {
            esc <- function(z) {
              z <- as.character(z)
              if (!length(z) || is.na(z[[1L]])) {
                return("")
              }
              gsub("|", "/", z[[1L]], fixed = TRUE)
            }
            paste0(
              "| ", esc(a), " | ", esc(b), " | ", esc(c), " | ", esc(d), " | ",
              esc(e), " | ", esc(f), " | ", esc(g), " | ", esc(h), " |"
            )
          }
          md_row9 <- function(a, b, c, d, e, f, g, h, i) {
            esc <- function(z) {
              z <- as.character(z)
              if (!length(z) || is.na(z[[1L]])) {
                return("")
              }
              gsub("|", "/", z[[1L]], fixed = TRUE)
            }
            paste0(
              "| ", esc(a), " | ", esc(b), " | ", esc(c), " | ", esc(d), " | ",
              esc(e), " | ", esc(f), " | ", esc(g), " | ", esc(h), " | ", esc(i), " |"
            )
          }
          job_outcome <- function(x) {
            if (!is.null(x[["job_status"]])) {
              as.character(x[["job_status"]])
            } else if (!is.null(x[["check_status"]])) {
              as.character(x[["check_status"]])
            } else {
              "unknown"
            }
          }
          rcmd_stat <- function(x) {
            if (is_rchk_row(x)) {
              return("n/a (rchk.sh — not R CMD check)")
            }
            v <- if (!is.null(x[["r_cmd_check_status"]])) {
              as.character(x[["r_cmd_check_status"]])
            } else {
              "unknown"
            }
            v
          }
          rcpp_stat <- function(x) {
            v <- getf(x, "rcpp_version")
            if (is_rchk_row(x) && identical(v, "not-installed")) {
              return("not-installed (re-run with current workflow for libPaths fix)")
            }
            v
          }
          lines <- character()
          lines <- c(lines, "## Cross-Platform Summary", "")
          run_u <- ""
          if (length(rows)) {
            for (z in rows) {
              u <- z[["actions_run_url"]]
              if (!is.null(u)) {
                uu <- trimws(as.character(u))
                if (length(uu) && nzchar(uu[[1L]])) {
                  run_u <- uu[[1L]]
                  break
                }
              }
            }
          }
          if (nzchar(run_u)) {
            lines <- c(lines, paste0("[Open this workflow run on GitHub](", run_u, ") (choose the matrix job to see full **rchk** / **bcheck** logs)."), "")
          }
          lines <- c(lines, paste0(
            "_R CMD check_ column is parsed from `check/**/00check.log` (`Status:` line), except **rchk** (see **rchk** subsection). ",
            "_Job_ column is the GitHub Actions job outcome after all steps (e.g. Valgrind grep can fail after `Status: OK`). ",
            "**R svn rev** is `R.version[[\"svn.rev\"]]` or `R.version[[\"svn rev\"]]` from the matrix job. ",
            "**Rcpp version** is the installed **Rcpp** from `setup-deps` (standard CRAN dependency resolution)."
          ))
          lines <- c(lines, "")
          if (!length(rows)) {
            lines <- c(lines, "_No platform report artifacts were found._", "")
          } else {
            lines <- c(lines, "| Platform | R version | R svn rev | Rcpp version | R CMD check (00check) | Job |",
                       "|---|---:|---:|---:|---|---|")
            for (x in rows) {
              lines <- c(lines, md_row6(
                getf(x, "platform"), getf(x, "r_version"), getf(x, "r_svn_rev", "unknown"),
                rcpp_stat(x), rcmd_stat(x), job_outcome(x)
              ))
            }
            lines <- c(lines, "")
            rchk_rows <- Filter(is_rchk_row, rows)
            if (length(rchk_rows)) {
              lines <- c(lines, "### rchk (static analysis)", "")
              if (any(vapply(rchk_rows, function(x) is.null(x[["rchk_check_kind"]]), logical(1L)))) {
                lines <- c(lines, paste0(
                  "> _Note:_ This run’s `rchk` JSON was produced **without** the newer `rchk_*` collector fields. ",
                  "Confirm the default branch includes the latest `.github/workflows/rhub.yaml`, then re-run; ",
                  "the main-table `R CMD check` cell for **rchk** is still overridden below for readability."
                ))
                lines <- c(lines, "")
              }
              lines <- c(lines, paste0(
                "The **rchk** rhub image runs **`rchk.sh`** (instrumented native compile, then static analysis). ",
                "It is **not** a standard `R CMD check` run, so the main table uses **`n/a (rchk.sh — not R CMD check)`** instead of a `Status:` line from `00check.log`. ",
                "The table below records whether we saw a completed native install marker `* DONE(<pkg>)` in any `check/**/00install.out`, plus optional paths that look like rchk/bcheck outputs under the workspace."
              ))
              lines <- c(lines, "")
              lines <- c(lines, "| Platform | R | R svn rev | Rcpp | `* DONE(pkg)*` in 00install.out | Job | install log / artifacts |",
                         "|---|---:|---:|---:|---|---|---|")
              rkget <- function(x, nm, alt = "") {
                v <- x[[nm]]
                if (is.null(v)) return(alt)
                as.character(v)[[1L]]
              }
              for (x in rchk_rows) {
                ilog <- rkget(x, "rchk_install_log_path", "")
                arts <- rkget(x, "rchk_artifact_paths", "")
                cell_parts <- character()
                if (nzchar(ilog)) cell_parts <- c(cell_parts, paste0("`", ilog, "`"))
                if (nzchar(arts)) cell_parts <- c(cell_parts, arts)
                cell <- if (length(cell_parts)) paste(cell_parts, collapse = " — ") else "—"
                lines <- c(lines, md_row7(
                  getf(x, "platform"), getf(x, "r_version"), getf(x, "r_svn_rev", "unknown"),
                  getf(x, "rcpp_version"),
                  rkget(x, "rchk_native_install_done", "unknown"),
                  job_outcome(x),
                  cell
                ))
              }
              lines <- c(lines, "")
              for (x in rchk_rows) {
                ex <- rkget(x, "rchk_log_excerpt", "")
                if (nzchar(ex)) {
                  ex2 <- gsub("```", "'''", ex, fixed = TRUE)
                  lines <- c(lines, paste0("**rchk / bcheck excerpt (truncated)** for `", getf(x, "platform"), "`:"), "")
                  lines <- c(lines, "```text")
                  lines <- c(lines, strsplit(ex2, "\n", fixed = TRUE)[[1L]], "```", "")
                } else if (nzchar(run_u)) {
                  lines <- c(lines, paste0(
                    "_No on-disk excerpt was captured for **", getf(x, "platform"),
                    "** (bcheck output may exist only in the job log). Use the workflow run link above._"
                  ), "")
                }
              }
              lines <- c(lines, "")
            }
          }
          md <- paste(lines, collapse = "\n")
          writeLines(lines, "platform-summary.md", useBytes = TRUE)
          gs <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(gs)) {
            cat(md, "\n", file = gs, append = file.exists(gs))
          }
          PRR
          Rscript "$f"

      - name: Upload platform summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-summary
          if-no-files-found: warn
          path: platform-summary.md
